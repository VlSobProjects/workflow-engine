[project]
name = "workflow-engine"
version = "0.1.0"
description = "An engine that executes workflows described in JSON"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "prettytable>=3.18.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplifications
    "PTH",  # prefer pathlib
    "BLE",  # blind except
    "RUF",  # ruff specific rules
]

[tool.ruff.lint.per-file-ignores]
# Modules are imported for their registration side effects.
"**/__init__.py" = ["F401"]
