name: CI

# Tests run where they pay off: after a merge into an integration line, on a pull request, or on
# demand for a branch (`gh workflow run ci.yml --ref <branch>`). A change to documentation only
# runs nothing here; the secrets scan in secrets.yml runs on every push regardless.
on:
  push:
    branches: [development, main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ruff and pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Install the locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  browser:
    # The report viewer in a real browser (ADR 022): one system, its own dependency group and browser.
    name: report viewer in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Install the locked environment with the browser group
        run: uv sync --locked --group browser
      - name: Install Chromium
        run: uv run --group browser playwright install --with-deps chromium
      - name: Browser tests
        run: uv run --group browser pytest -m browser
